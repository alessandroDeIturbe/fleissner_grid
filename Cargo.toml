[package]
name = "fleissner_cipher"
version = "0.1.0"
edition = "2021"

[dependencies]
# La libreria rand serve per la generazione casuale della maschera
# e per le lettere di riempimento casuali.
rand = "0.8.5"
rand_chacha = "0.3.1" # Aggiungi questa per il seed
serde = { version = "1", features = ["derive"] }
serde_json = "1"
